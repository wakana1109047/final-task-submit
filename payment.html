<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お支払い方法</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
            <link rel="icon" href="favicon (3).ico">


    <style>
        /* 全体 */
        body {
            background-color: #050606;
            color: #e5e7eb;
        }

        html {
            scroll-behavior: smooth;
        }

       
        .card-dark {
            background-color: #0c0f0f;
            border: 1px solid #1f2937;
            border-radius: 12px;
        }

        /* 支払い方法 */
        .list-group-item {
            background-color: #0c0f0f;
            color: #e5e7eb;
            border-color: #1f2937;
            font-weight: 500;
        }

        .list-group-item:hover {
            background-color: #1f2937;
            color: #ffffff;
        }

        
        h2,
        h4,
        h6 {
            color: #f9fafb;
        }

        .form-label {
            color: #e5e7eb;
            font-weight: 500;
        }        
        .form-control {
            background-color: #020617;
            color: #f9fafb;
            border: 1px solid #374151;
        }

        .form-control::placeholder {
            color: #9ca3af;
        }

        .form-control:focus {
            background-color: #020617;
            color: #ffffff;
            border-color: #8b5cf6;
            box-shadow: 0 0 0 0.2rem rgba(139, 92, 246, 0.25);
        }
        .form-check-label {
            color: #f9fafb;
            cursor: pointer;
        }

        .form-check-input {
            background-color: #020617;
            border-color: #6b7280;
        }

        .form-check-input:checked {
            background-color: #8b5cf6;
            border-color: #8b5cf6;
        }
        .text-secondary {
            color: #9ca3af !important;
        }
        .btn-confirm {
            background-color: #8b5cf6;
            color: #ffffff;
            font-weight: bold;
            border-radius: 10px;
        }

        .btn-confirm:hover {
            background-color: #7c3aed;
            color: #ffffff;
        }
    </style>

</head>

<body>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <h2 class="fw-bold mb-4 text-center">
                    <i class="bi bi-credit-card"></i> お支払い方法
                </h2>

                <div class="card card-dark p-4 mb-4">

                    <!-- 支払い方法選択 -->
                    <div class="list-group mb-4">
                        <a href="#creditSection" class="list-group-item list-group-item-action">
                            <i class="bi bi-credit-card me-2 text-warning"></i>
                            クレジットカード
                        </a>
                        <a href="#paypaySection" class="list-group-item list-group-item-action">
                            <i class="bi bi-phone me-2 text-primary"></i>
                            PayPay
                        </a>
                        <a href="#convenienceSection" class="list-group-item list-group-item-action">
                            <i class="bi bi-shop me-2 text-info"></i>
                            コンビニ先払い
                        </a>
                    </div>

                    <!-- クレジットカード -->
                    <section id="creditSection" class="mb-5">
                        <h4 class="fw-bold mb-3">クレジットカード</h4>

                        <div class="mb-3">
                            <label class="form-label">カード番号</label>
                            <input type="text" class="form-control" placeholder="1234 5678 9012 3456">
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">有効期限</label>
                                <input type="text" class="form-control" placeholder="MM / YY">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">セキュリティコード</label>
                                <input type="text" class="form-control" placeholder="CVC">
                            </div>
                        </div>
                    </section>

                    <!-- PayPay -->
                    <section id="paypaySection" class="mb-5">
                        <h4 class="fw-bold mb-3">PayPay</h4>
                        <p class="text-secondary">
                            注文確定後、PayPayアプリに自動で遷移します。
                        </p>
                    </section>

                    <!-- コンビニ -->
                    <section id="convenienceSection" class="mb-4">
                        <h4 class="fw-bold mb-3">コンビニ先払い</h4>

                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" name="store" id="seven">
                            <label class="form-check-label" for="seven">
                                セブンイレブン
                            </label>
                        </div>

                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" name="store" id="lawson">
                            <label class="form-check-label" for="lawson">
                                ローソン
                            </label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="store" id="familymart">
                            <label class="form-check-label" for="familymart">
                                ファミリーマート
                            </label>
                        </div>
                    </section>

                    <a href="#completeSection" class="btn btn-lg w-100 fw-bold mt-5"
                        style="background:#8b5cf6;color:white;">
                        支払いを確定する
                    </a>


                </div>

            </div>
        </div>
        <section id="completeSection" class="mt-10 pt-5" style="margin-top: 400px; padding-top: 200px;">
            <div class="text-center py-5">
                <i class="bi bi-check-circle-fill fs-1 mb-4 " style="color:#8b5cf6;"></i>

                <h3 class="fw-bold mb-3">お支払いが完了しました</h3>

                <p class="text-secondary mb-4">
                    ご購入ありがとうございます。<br>
                    チケットはマイページから確認できます。
                </p>

                <a href="music-festival-myticket.html" class="btn btn-outline-light">
                    マイチケットを見る
                </a>
            </div>
        </section>

    </div>

</body>

</html>
