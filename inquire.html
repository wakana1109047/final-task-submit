<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous"></script>
        <link rel="icon" href="favicon (3).ico">

    <style>
        body {
            background: linear-gradient(135deg, var(--dark-bg) 0%, var(--primary-color) 50%, var(--secondary-color) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            /* overflow: hidden; */
        }

        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(85, 2, 137, 0.3), transparent);
            border-radius: 50%;
            top: -200px;
            right: -200px;
            animation: float 6s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(43, 202, 141, 0.3), transparent);
            border-radius: 50%;
            bottom: -150px;
            left: -150px;
            animation: float 8s ease-in-out infinite reverse;
        }
    </style>

</head>

<body>
    <div class="container d-flex justify-content-center">
        <div style="max-width: 650px; width: 100%;">

            <!-- タイトル -->
            <div class="text-center  mb-4">
                <h1 class="mb-2 mt-3">お問い合わせ</h1>
                <p class="opacity-75">
                    ご不明点やご相談がありましたら、お気軽にご連絡ください
                </p>
            </div>

            <!-- フォームカード -->
            <div class="card p-4 shadow-lg">
                <h2 class="h5 mb-3">お問い合わせフォーム</h2>

                <div class="mb-3">
                    <label class="form-label">お名前 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" placeholder="山田 太郎">
                </div>

                <div class="mb-3">
                    <label class="form-label">メールアドレス <span class="text-danger">*</span></label>
                    <input type="email" class="form-control" placeholder="example@mail.com">
                </div>
                <div class="mb-3">
                    <label class="form-label">電話番号<span class="text-danger">*</span></label>
                    <input type="tel" class="form-control" placeholder="000-0000-0000">
                </div>
                <div class="mb-3">
                    <label class="form-label">お問い合わせ種別</label>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="contactType" id="type1" checked>
                        <label for="type1" class="form-check-label">
                            ご質問
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="contactType" id="type2">
                        <label class="form-check-label" for="type2">
                            ご相談
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="contactType" id="type3">
                        <label class="form-check-label" for="type3">
                            その他
                        </label>
                        
                    </div>
                </div> 

                <div class="mb-3">
                    <label class="form-label">お問い合わせ内容</label>
                    <textarea class="form-control" rows="4" placeholder="ご質問の内容をご記入ください"></textarea>
                </div>

                <button class="btn btn-primary w-100 mt-2">
                    <i class="bi bi-send"></i> 送信する
                </button>

                <p class="text-muted small mt-3 mb-0">
                    ※ 通常2〜3営業日以内にご返信いたします
                </p>
            </div>

            <!-- FAQ -->
            <div class="text-center mt-3">
                <a href="FAQ.html" class="link-light">
                    よくある質問はこちら →
                </a>
            </div>

        </div>
    </div>

</body>

</html>
